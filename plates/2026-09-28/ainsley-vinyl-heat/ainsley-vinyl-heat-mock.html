<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AINSLEY · Vinyl Heat LOOK · AVINYL2 · 1080×1920</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #030508; font-family: Inter, system-ui, sans-serif; color: #f2ead4; }
.stage {
  position: relative; width: 1080px; height: 1920px;
  background:
    radial-gradient(ellipse 90% 70% at 50% 8%, rgba(255,170,40,0.20), transparent 58%),
    radial-gradient(ellipse 45% 35% at 88% 92%, rgba(184,90,40,0.10), transparent 55%),
    linear-gradient(180deg, #0a0908 0%, #030508 45%, #0c0804 100%);
}
.pad { position: relative; z-index: 1; height: 100%; padding: 28px 22px 18px; display: flex; flex-direction: column; }
.panel {
  flex: 1; display: flex; flex-direction: column; gap: 18px; border-radius: 28px; overflow: hidden; position: relative;
  padding: 22px 24px 18px;
  background: linear-gradient(165deg, rgba(8,10,16,0.98) 0%, rgba(18,14,6,0.94) 48%, rgba(4,6,12,0.98) 100%);
  border: 2px solid rgba(255,190,64,0.55);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.22),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 12px 0 rgba(8,10,14,0.4),
    0 0 48px rgba(255,170,30,0.32),
    0 40px 100px rgba(0,0,0,0.7);
}
.panel::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 72% 40% at 12% -5%, rgba(255,190,50,0.18), transparent 55%);
}
.panel > * { position: relative; z-index: 2; }

/* header — clock owns identity · Weather/Sensi only */
.hdr {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 16px; border-radius: 16px;
  background: rgba(1,2,5,0.88);
  border: 1.5px solid rgba(255,190,64,0.4);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.12), 0 0 24px rgba(255,170,30,0.18);
}
.clock-block { display: flex; align-items: baseline; gap: 10px; }
.clock-lab {
  font-family: "JetBrains Mono", monospace; font-size: 14px; font-weight: 800;
  letter-spacing: 0.2em; color: #ffe8a0; text-shadow: 0 0 12px rgba(255,180,40,0.45);
}
.clock {
  font-size: 64px; font-weight: 900; letter-spacing: -0.06em; line-height: 0.9;
  color: #ffe8a0;
  text-shadow: 0 0 40px rgba(255,180,30,0.7), 0 0 14px rgba(255,200,60,0.4), 0 2px 0 rgba(0,0,0,0.65);
}
.ovals { display: flex; gap: 10px; }
.oval {
  display: flex; align-items: center; gap: 8px; min-width: 148px; padding: 10px 14px;
  border-radius: 999px;
  background: linear-gradient(145deg, rgba(255,200,70,0.22), rgba(180,90,10,0.18));
  border: 1.5px solid rgba(255,200,80,0.65);
  box-shadow: 0 0 16px rgba(255,170,30,0.28), inset 0 1px 0 rgba(255,230,160,0.25);
}
.oval .k { font-family: "JetBrains Mono", monospace; font-size: 9px; font-weight: 800; letter-spacing: 0.14em; color: #ffe894; }
.oval .v { font-size: 15px; font-weight: 850; color: #fff8e0; }
.oval .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0a818; box-shadow: 0 0 10px rgba(255,180,40,0.8); }

/* vinyl stage — hero */
.stage-row {
  display: flex; gap: 18px; align-items: stretch; margin-top: 8px; flex: 1; min-height: 0;
}
.vinyl-wrap {
  flex: 0 0 520px; display: grid; place-items: center;
  border-radius: 20px; padding: 28px;
  background: rgba(0,0,0,0.5);
  border: 1.5px solid rgba(255,190,64,0.32);
  box-shadow: inset 0 0 48px rgba(255,170,30,0.08), 0 0 36px rgba(255,170,30,0.18);
}
.vinyl-wrap img {
  width: 480px; height: 480px; display: block;
  filter: drop-shadow(0 0 22px rgba(245,180,70,0.4)) drop-shadow(0 12px 28px rgba(0,0,0,0.55));
}
.side-stack { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; justify-content: center; }

/* one next-up — almost no label */
.next {
  border-radius: 18px; padding: 22px 20px;
  background: linear-gradient(125deg, rgba(55,45,12,0.98), rgba(10,12,16,0.99) 55%);
  border: 1.5px solid rgba(255,210,90,0.75);
  box-shadow: 0 0 36px rgba(245,197,66,0.32), inset 0 1px 0 rgba(255,255,255,0.1);
}
.next .quiet {
  font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 800;
  letter-spacing: 0.18em; color: rgba(255,232,160,0.55); text-transform: uppercase;
}
.next .main { margin-top: 8px; font-size: 28px; font-weight: 900; color: #fff; letter-spacing: -0.02em; }
.next .sub { margin-top: 6px; font-size: 15px; font-weight: 600; color: rgba(200,190,160,0.55); }

/* one progress — numbers only */
.prog {
  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px;
  background: rgba(1,2,5,0.9); border: 1.5px solid rgba(255,190,64,0.35);
}
.prog .track { flex: 1; height: 20px; border-radius: 6px; background: #0a0c10; border: 1.5px solid rgba(255,190,64,0.28); overflow: hidden; }
.prog .fill { height: 100%; width: 42%; background: linear-gradient(90deg, #a85808, #f0a818, #ffe894); box-shadow: 0 0 14px rgba(255,180,40,0.5); }
.prog .meta { font-family: "JetBrains Mono", monospace; font-size: 18px; font-weight: 800; color: #ffe894; min-width: 48px; text-align: right; }

/* ≤3 unlabeled session pills */
.pills {
  display: flex; gap: 10px; padding: 10px; border-radius: 14px;
  background: rgba(12,11,9,0.82); border: 1px solid rgba(245,196,70,0.14);
}
.pill {
  flex: 1; height: 44px; border-radius: 999px; display: grid; place-items: center;
}
.pill.live {
  background: linear-gradient(90deg, #a85808 0%, #f0a818 42%, #ffe894 100%);
  border: 1px solid #9a6810;
  box-shadow: 0 0 14px rgba(255,180,30,0.4), inset 0 1px 0 rgba(255,255,255,0.3);
}
.pill.live .dot { width: 10px; height: 10px; border-radius: 50%; background: #140c02; opacity: 0.5; }
.pill.off {
  background: #080706; border: 1px dashed rgba(160,156,140,0.3); opacity: 0.5;
}
.pill.off .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(180,176,160,0.35); }

/* jar — quiet strip · huge remaining */
.jar {
  margin-top: auto;
  border-radius: 18px; padding: 22px 22px 20px;
  background: linear-gradient(145deg, rgba(255,200,70,0.10), transparent 42%),
              linear-gradient(165deg, rgba(8,10,16,0.98), rgba(18,14,6,0.94));
  border: 2px solid rgba(255,190,64,0.55);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.18), 0 0 32px rgba(255,170,30,0.22), 0 8px 0 rgba(8,10,14,0.35);
}
.jar-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.jar .quiet {
  font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 800;
  letter-spacing: 0.18em; color: rgba(255,232,160,0.5); text-transform: uppercase;
}
.jar .count {
  font-size: 72px; font-weight: 900; color: #ffe894; line-height: 0.85;
  text-shadow: 0 0 28px rgba(255,180,40,0.55); letter-spacing: -0.04em;
}
.jar .track {
  margin-top: 16px; height: 44px; border-radius: 10px;
  background: #010205; border: 2px solid rgba(255,190,64,0.45);
  box-shadow: inset 0 2px 8px rgba(0,0,0,0.65), 0 0 18px rgba(255,170,30,0.2);
  overflow: hidden;
}
.jar .fill {
  height: 100%; width: 35%;
  background: linear-gradient(90deg, #a85808, #f0a818, #ffe894);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.35), 0 0 20px rgba(255,180,40,0.5);
}

.footnote {
  text-align: center; font-size: 10px; font-weight: 650; color: rgba(180,176,160,0.35);
  letter-spacing: 0.1em; padding-top: 2px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="pad">
    <div class="panel">
      <header class="hdr">
        <div class="clock-block">
          <div class="clock-lab">CT</div>
          <div class="clock">10:05 PM</div>
        </div>
        <div class="ovals">
          <div class="oval"><span class="dot"></span><div><div class="k">WEATHER</div><div class="v">68° clear</div></div></div>
          <div class="oval"><span class="dot"></span><div><div class="k">SENSI</div><div class="v">72° · auto</div></div></div>
        </div>
      </header>

      <div class="stage-row">
        <div class="vinyl-wrap">
          <img src="ainsley-vinyl-amber.png" alt=""/>
        </div>
        <div class="side-stack">
          <div class="next">
            <div class="quiet">Next</div>
            <div class="main">Vanity 3:00 · Jessy</div>
            <div class="sub">with Dad @ 147th</div>
          </div>
          <div class="prog" aria-label="progress">
            <div class="track"><div class="fill"></div></div>
            <div class="meta">2/6</div>
          </div>
          <div class="pills" aria-hidden="true">
            <div class="pill live"><span class="dot"></span></div>
            <div class="pill off"><span class="dot"></span></div>
            <div class="pill off"><span class="dot"></span></div>
          </div>
        </div>
      </div>

      <section class="jar" aria-label="jar">
        <div class="jar-row">
          <div class="quiet">Saved</div>
          <div class="count">0</div>
        </div>
        <div class="track"><div class="fill"></div></div>
      </section>

      <div class="footnote">LOOK PLATE · AVINYL2 · NO LIVE PAGES EDIT · HOMAGE-CLEAN</div>
    </div>
  </div>
</div>
</body>
</html>
