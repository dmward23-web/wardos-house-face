<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>AINSLEY · Vinyl Heat · AVINYL3 · 1080×1920</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@800;900&family=JetBrains+Mono:wght@800&display=swap" rel="stylesheet"/>
<style>
/* AVINYL3 · fresh void+amber · icon-first · denser fill · homage-clean · no merch DNA */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: #010205;
  font-family: Inter, system-ui, sans-serif; color: #f2ead4;
}
.stage {
  width: 1080px; height: 1920px; position: relative;
  background:
    radial-gradient(ellipse 100% 55% at 50% -2%, rgba(255,176,40,0.28), transparent 62%),
    radial-gradient(ellipse 55% 40% at 100% 100%, rgba(184,90,40,0.16), transparent 58%),
    linear-gradient(180deg, #0a0908 0%, #010205 42%, #0c0804 100%);
}
.frame {
  position: absolute; inset: 12px;
  border-radius: 26px;
  background: linear-gradient(168deg, rgba(6,8,12,0.99) 0%, rgba(16,12,4,0.96) 50%, rgba(3,5,10,0.99) 100%);
  border: 2px solid rgba(255,190,64,0.58);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.2),
    inset 0 -1px 0 rgba(0,0,0,0.6),
    0 0 56px rgba(255,170,30,0.34),
    0 28px 80px rgba(0,0,0,0.72);
  display: flex; flex-direction: column; gap: 10px;
  padding: 12px 12px 8px;
  overflow: hidden;
}
.frame::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(ellipse 85% 42% at 8% -6%, rgba(255,190,50,0.2), transparent 56%);
  border-radius: inherit;
}
.frame > * { position: relative; z-index: 1; }

/* header */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-radius: 16px; flex: 0 0 86px;
  background: rgba(1,2,5,0.92);
  border: 2px solid rgba(255,190,64,0.48);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.12), 0 0 28px rgba(255,170,30,0.2);
}
.clock {
  font-size: 72px; font-weight: 900; letter-spacing: -0.07em; line-height: 1;
  color: #ffe8a0;
  text-shadow: 0 0 48px rgba(255,180,30,0.8), 0 0 16px rgba(255,200,60,0.5), 0 2px 0 #000;
}
.ovals { display: flex; gap: 10px; }
.oval {
  display: flex; align-items: center; gap: 10px;
  height: 60px; padding: 0 18px; border-radius: 999px;
  background: linear-gradient(145deg, rgba(255,200,70,0.28), rgba(180,90,10,0.2));
  border: 2px solid rgba(255,200,80,0.72);
  box-shadow: 0 0 18px rgba(255,170,30,0.34), inset 0 1px 0 rgba(255,230,160,0.28);
}
.oval svg { width: 30px; height: 30px; flex-shrink: 0; }
.oval .n {
  font-family: "JetBrains Mono", monospace;
  font-size: 20px; font-weight: 800; color: #fff8e0; letter-spacing: -0.03em;
}

/* main: vinyl dominates · side rail packed */
.main {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 1.65fr 0.95fr;
  gap: 10px;
}
.vinyl-bay {
  border-radius: 20px;
  background:
    radial-gradient(circle at 50% 48%, rgba(255,176,40,0.2) 0%, transparent 58%),
    rgba(0,0,0,0.55);
  border: 2px solid rgba(255,190,64,0.42);
  box-shadow: inset 0 0 64px rgba(255,170,30,0.16), 0 0 40px rgba(255,170,30,0.24);
  display: grid; place-items: center;
  padding: 10px;
  overflow: hidden;
}
.vinyl-bay img {
  width: 100%; max-width: 680px; height: auto; aspect-ratio: 1; display: block;
  filter:
    drop-shadow(0 0 36px rgba(245,180,70,0.58))
    drop-shadow(0 16px 36px rgba(0,0,0,0.6));
}

.rail {
  display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0;
}

/* next card — STACKED glyph over time · fills height · no empty void */
.next {
  flex: 1 1 auto; min-height: 0;
  border-radius: 20px; padding: 18px 14px;
  background: linear-gradient(160deg, rgba(60,48,10,0.98), rgba(8,10,14,0.99) 62%);
  border: 2px solid rgba(255,210,90,0.8);
  box-shadow: 0 0 40px rgba(245,197,66,0.38), inset 0 1px 0 rgba(255,255,255,0.1);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
}
.next .g {
  width: 140px; height: 140px; border-radius: 28px; flex: 0 0 auto;
  background: linear-gradient(145deg, rgba(255,200,70,0.36), rgba(180,90,10,0.3));
  border: 2px solid rgba(255,200,80,0.65);
  box-shadow: 0 0 28px rgba(255,170,30,0.42);
  display: grid; place-items: center;
}
.next .g svg { width: 78px; height: 78px; }
.next .t {
  font-family: "JetBrains Mono", monospace;
  font-size: 72px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
  color: #ffe894;
  text-shadow: 0 0 32px rgba(255,180,40,0.6);
}

/* thick segment meter */
.prog {
  flex: 0 0 68px;
  display: flex; align-items: stretch; gap: 7px;
  padding: 12px; border-radius: 14px;
  background: rgba(1,2,5,0.94);
  border: 2px solid rgba(255,190,64,0.42);
}
.seg {
  flex: 1; border-radius: 8px;
  background: #0a0c10; border: 1.5px solid rgba(255,190,64,0.2);
}
.seg.on {
  background: linear-gradient(180deg, #ffe894 0%, #f0a818 45%, #a85808 100%);
  border-color: rgba(255,210,90,0.55);
  box-shadow: 0 0 16px rgba(255,180,40,0.55);
}

/* thick pill rail */
.pills {
  flex: 0 0 72px;
  display: flex; gap: 8px; padding: 10px; border-radius: 14px;
  background: rgba(12,11,9,0.9);
  border: 1.5px solid rgba(245,196,70,0.2);
}
.pill {
  flex: 1; border-radius: 999px; display: grid; place-items: center;
}
.pill.live {
  background: linear-gradient(90deg, #a85808, #f0a818 44%, #ffe894);
  border: 1.5px solid #9a6810;
  box-shadow: 0 0 18px rgba(255,180,30,0.48), inset 0 1px 0 rgba(255,255,255,0.32);
}
.pill.live i {
  width: 14px; height: 14px; border-radius: 50%;
  background: #140c02; opacity: 0.5; display: block;
}
.pill.off {
  background: #080706;
  border: 1.5px dashed rgba(160,156,140,0.34);
  opacity: 0.55;
}
.pill.off i {
  width: 14px; height: 14px; border-radius: 50%;
  background: rgba(180,176,160,0.35); display: block;
}

/* jar — tall dense full-width */
.jar {
  flex: 0 0 118px;
  display: flex; align-items: center; gap: 16px;
  padding: 16px 18px; border-radius: 18px;
  background:
    linear-gradient(145deg, rgba(255,200,70,0.14), transparent 44%),
    linear-gradient(165deg, rgba(8,10,16,0.98), rgba(18,14,6,0.94));
  border: 2px solid rgba(255,190,64,0.6);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.2),
    0 0 36px rgba(255,170,30,0.28),
    0 8px 0 rgba(8,10,14,0.36);
}
.jar .star {
  flex: 0 0 72px; width: 72px; height: 72px;
  display: grid; place-items: center;
}
.jar .star svg {
  width: 60px; height: 60px;
  filter: drop-shadow(0 0 18px rgba(255,180,40,0.65));
}
.jar .meter {
  flex: 1; height: 68px; border-radius: 14px;
  background: #010205;
  border: 2px solid rgba(255,190,64,0.52);
  box-shadow: inset 0 3px 12px rgba(0,0,0,0.72), 0 0 22px rgba(255,170,30,0.24);
  overflow: hidden;
}
.jar .fill {
  height: 100%; width: 35%;
  background: linear-gradient(90deg, #a85808, #f0a818 50%, #ffe894);
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.38), 0 0 26px rgba(255,180,40,0.55);
}

.foot {
  flex: 0 0 auto; text-align: center;
  font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
  color: rgba(180,176,160,0.28); padding: 0 0 2px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <header class="hdr">
      <div class="clock">10:11</div>
      <div class="ovals">
        <div class="oval" aria-label="weather">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2" fill="#ffe894"/>
            <g stroke="#ffe894" stroke-width="2" stroke-linecap="round">
              <line x1="12" y1="2.5" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="21.5"/>
              <line x1="2.5" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="21.5" y2="12"/>
              <line x1="5.2" y1="5.2" x2="7" y2="7"/><line x1="17" y1="17" x2="18.8" y2="18.8"/>
              <line x1="18.8" y1="5.2" x2="17" y2="7"/><line x1="7" y1="17" x2="5.2" y2="18.8"/>
            </g>
          </svg>
          <span class="n">68°</span>
        </div>
        <div class="oval" aria-label="sensi">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="10" y="2.5" width="4" height="13" rx="2" stroke="#ffe894" stroke-width="1.8"/>
            <circle cx="12" cy="18.5" r="3.2" fill="#f0a818" stroke="#ffe894" stroke-width="1.5"/>
            <line x1="12" y1="14" x2="12" y2="18" stroke="#ffe894" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="n">72°</span>
        </div>
      </div>
    </header>

    <div class="main">
      <div class="vinyl-bay">
        <img src="ainsley-vinyl-amber.png" alt=""/>
      </div>
      <div class="rail">
        <div class="next" aria-label="next">
          <div class="g">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="9" stroke="#ffe894" stroke-width="1.8"/>
              <path d="M12 7v5.2l3.2 2" stroke="#ffe894" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="t">3:00</div>
        </div>
        <div class="prog" aria-label="progress">
          <div class="seg on"></div><div class="seg on"></div>
          <div class="seg"></div><div class="seg"></div>
          <div class="seg"></div><div class="seg"></div>
        </div>
        <div class="pills" aria-hidden="true">
          <div class="pill live"><i></i></div>
          <div class="pill off"><i></i></div>
          <div class="pill off"><i></i></div>
        </div>
      </div>
    </div>

    <section class="jar" aria-label="jar">
      <div class="star" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="#ffe894" d="M12 2.4l2.6 6.4 6.9.6-5.2 4.6 1.6 6.7L12 16.8 6.1 20.7l1.6-6.7L2.5 9.4l6.9-.6L12 2.4z"/></svg>
      </div>
      <div class="meter"><div class="fill"></div></div>
    </section>

    <div class="foot">LOOK · AVINYL3 · NO LIVE PAGES · HOMAGE-CLEAN</div>
  </div>
</div>
</body>
</html>
