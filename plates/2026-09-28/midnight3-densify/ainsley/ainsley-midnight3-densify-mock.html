<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet"/>
<style>
/* MIDNIGHT3 / TEXTBACK1 · innocent-but-guilty · essential words + icon heat */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1080px; height: 1920px; overflow: hidden;
  background: #010205;
  font-family: Inter, system-ui, sans-serif; color: #f2ead4;
}
.stage {
  width: 1080px; height: 1920px; position: relative;
  background:
    radial-gradient(ellipse 92% 54% at 38% 42%, rgba(255,148,20,0.32), transparent 55%),
    radial-gradient(ellipse 100% 44% at 50% -3%, rgba(255,176,40,0.26), transparent 58%),
    radial-gradient(ellipse 46% 32% at 100% 100%, rgba(184,90,40,0.2), transparent 52%),
    linear-gradient(180deg, #0a0908 0%, #010205 44%, #0c0804 100%);
}
.frame {
  position: absolute; inset: 8px;
  border-radius: 24px;
  background: linear-gradient(168deg, rgba(6,8,12,0.99) 0%, rgba(14,11,4,0.97) 52%, rgba(3,5,10,0.99) 100%);
  border: 2px solid rgba(255,190,64,0.55);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.16),
    0 0 64px rgba(255,145,18,0.26),
    0 0 110px rgba(184,90,40,0.14),
    0 24px 70px rgba(0,0,0,0.7);
  display: flex; flex-direction: column; gap: 5px;
  padding: 7px 7px 3px;
  overflow: hidden;
}
.frame::before {
  content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(ellipse 66% 34% at 10% -4%, rgba(255,180,40,0.15), transparent 54%),
    radial-gradient(ellipse 48% 26% at 90% 68%, rgba(255,125,12,0.1), transparent 58%);
  border-radius: inherit;
}
.frame > * { position: relative; z-index: 1; }

.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; border-radius: 14px; flex: 0 0 68px;
  background: linear-gradient(180deg, rgba(22,18,10,0.68) 0%, rgba(2,3,6,0.96) 100%);
  border: 1.5px solid rgba(255,200,80,0.48);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.18), 0 12px 30px rgba(255,135,18,0.16);
}
.clock {
  font-size: 60px; font-weight: 900; letter-spacing: -0.07em; line-height: 1;
  color: #ffe8a0;
  text-shadow: 0 0 34px rgba(255,170,25,0.72), 0 0 12px rgba(255,200,60,0.4), 0 2px 0 #000;
}
.ovals { display: flex; gap: 7px; }
.oval {
  display: flex; align-items: center; gap: 7px;
  height: 48px; padding: 0 14px; border-radius: 999px;
  background: linear-gradient(145deg, rgba(255,200,70,0.2), rgba(40,28,8,0.88));
  border: 1.5px solid rgba(255,200,80,0.6);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.26), 0 8px 16px rgba(255,135,18,0.2);
}
.oval svg { width: 22px; height: 22px; flex-shrink: 0; }
.oval .n {
  font-family: "JetBrains Mono", monospace;
  font-size: 16px; font-weight: 800; color: #fff8e0; letter-spacing: -0.03em;
}

.main {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: 1.62fr 1fr;
  gap: 5px;
}
.vinyl-bay {
  border-radius: 18px;
  position: relative;
  background:
    radial-gradient(circle at 50% 38%, rgba(255,145,20,0.42) 0%, rgba(255,110,8,0.14) 34%, transparent 58%),
    linear-gradient(180deg, rgba(18,12,4,0.7) 0%, rgba(2,2,4,0.92) 55%, rgba(22,12,2,0.75) 100%);
  border: 1.5px solid rgba(255,190,64,0.42);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.1),
    inset 0 0 70px rgba(255,130,15,0.12),
    0 18px 48px rgba(255,115,10,0.26),
    0 0 56px rgba(255,140,18,0.2);
  display: flex; flex-direction: column; align-items: stretch;
  padding: 8px 8px 10px;
  overflow: hidden;
  gap: 7px;
}
.vinyl-bay::before {
  content: ""; position: absolute; left: 4%; right: 4%; top: 2%; height: 62%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,150,25,0.5) 0%, rgba(184,70,14,0.16) 42%, transparent 68%);
  filter: blur(18px);
  z-index: 0; pointer-events: none;
}
.vinyl-bay img {
  position: relative; z-index: 1;
  width: 100%; aspect-ratio: 1; height: auto;
  flex: 0 0 auto; object-fit: contain; display: block;
  filter:
    drop-shadow(0 0 28px rgba(255,150,25,0.72))
    drop-shadow(0 16px 28px rgba(0,0,0,0.62))
    drop-shadow(0 28px 48px rgba(255,110,10,0.34));
  transform: scale(1.04);
  transform-origin: center top;
}
.vinyl-bay .under {
  position: relative; z-index: 1;
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; justify-content: stretch; gap: 6px;
  padding: 2px 2px 0;
}
.vinyl-bay .heatbar {
  flex: 0 0 88px;
  border-radius: 14px;
  background:
    linear-gradient(180deg, rgba(255,180,50,0.18) 0%, rgba(40,24,6,0.92) 100%);
  border: 1.5px solid rgba(255,200,80,0.48);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.28),
    0 10px 24px rgba(255,120,10,0.28),
    0 0 28px rgba(255,140,18,0.22);
  display: flex; flex-direction: column;
  align-items: stretch; justify-content: center; gap: 8px;
  padding: 10px 12px;
}
.vinyl-bay .heatbar .row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.vinyl-bay .heatbar .wlab { font-size: 14px; opacity: 0.98; letter-spacing: 0.16em; }
.vinyl-bay .heatbar .hbar {
  flex: 1; height: 28px; border-radius: 9px;
  background: #010205;
  border: 1.5px solid rgba(255,190,64,0.5);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.7), 0 0 12px rgba(255,140,18,0.18);
  overflow: hidden;
}
.vinyl-bay .heatbar .hbar .f {
  height: 100%; width: 66%;
  background: linear-gradient(90deg, #a85808, #f0a818 55%, #ffe894);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 12px rgba(255,170,30,0.45);
}
.vinyl-bay .heatbar .segs {
  display: flex; gap: 5px; height: 14px;
}
.vinyl-bay .heatbar .segs i {
  flex: 1; border-radius: 4px; display: block;
  background: #080a0e; border: 1px solid rgba(255,190,64,0.18);
}
.vinyl-bay .heatbar .segs i.on {
  background: linear-gradient(180deg, #ffe894 0%, #f0a818 50%, #a85808 100%);
  border-color: rgba(255,210,90,0.55);
  box-shadow: 0 0 8px rgba(255,170,30,0.45);
}
.vinyl-bay .udots {
  flex: 0 0 62px;
  display: flex; gap: 7px; align-items: stretch;
}
.vinyl-bay .udot {
  flex: 1; border-radius: 12px;
  background: linear-gradient(145deg, rgba(255,200,70,0.16), rgba(30,22,8,0.9));
  border: 1.5px solid rgba(255,190,64,0.4);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.16), 0 8px 16px rgba(255,120,10,0.16);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
.vinyl-bay .udot i {
  width: 10px; height: 10px; border-radius: 50%; display: block;
  background: radial-gradient(circle at 40% 35%, #ffe894, #a85808);
  box-shadow: 0 0 12px rgba(255,170,30,0.55);
}
.vinyl-bay .udot.off {
  opacity: 0.55;
  border-style: dashed;
  border-color: rgba(160,156,140,0.3);
}
.vinyl-bay .udot.off i {
  background: rgba(180,176,160,0.35);
  box-shadow: none;
}

.rail {
  display: flex; flex-direction: column; gap: 5px; min-width: 0; min-height: 0;
}

.next {
  flex: 0 0 168px;
  border-radius: 16px; padding: 10px 10px;
  background: linear-gradient(165deg, rgba(36,28,10,0.9) 0%, rgba(6,8,12,0.98) 70%);
  border: 1.5px solid rgba(255,210,90,0.68);
  box-shadow:
    inset 0 1px 0 rgba(255,235,180,0.16),
    0 12px 30px rgba(255,135,18,0.26),
    0 0 34px rgba(245,180,50,0.18);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
}
.next .g {
  width: 56px; height: 56px; border-radius: 16px;
  background: linear-gradient(145deg, rgba(255,200,70,0.26), rgba(50,36,8,0.9));
  border: 1.5px solid rgba(255,200,80,0.55);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.22), 0 8px 18px rgba(255,135,18,0.28);
  display: grid; place-items: center;
}
.next .g svg { width: 30px; height: 30px; }
.next .t {
  font-family: "JetBrains Mono", monospace;
  font-size: 40px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;
  color: #ffe894;
  text-shadow: 0 0 24px rgba(255,170,30,0.52);
}

.twins {
  flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-rows: 1fr 1fr 1fr; gap: 5px;
}
.twin {
  border-radius: 14px; padding: 8px 10px;
  background: linear-gradient(165deg, rgba(28,22,8,0.9) 0%, rgba(4,5,8,0.97) 72%);
  border: 1.5px solid rgba(255,190,64,0.48);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.14),
    0 10px 24px rgba(255,120,10,0.2),
    0 0 24px rgba(255,140,18,0.12);
  display: flex; flex-direction: row;
  align-items: center; gap: 10px;
  min-height: 0;
}
.twin .g {
  flex: 0 0 60px; width: 60px; height: 60px;
  border-radius: 14px;
  background: linear-gradient(145deg, rgba(255,200,70,0.22), rgba(40,28,8,0.88));
  border: 1.5px solid rgba(255,200,80,0.5);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.2), 0 8px 16px rgba(255,125,12,0.22);
  display: grid; place-items: center;
}
.twin .g svg {
  width: 32px; height: 32px;
  filter: drop-shadow(0 0 12px rgba(255,170,30,0.55));
}
.twin .bar {
  height: 26px; border-radius: 8px;
  background: #010205;
  border: 1.5px solid rgba(255,190,64,0.45);
  box-shadow: inset 0 2px 6px rgba(0,0,0,0.7), 0 0 10px rgba(255,140,18,0.14);
  overflow: hidden;
}
.twin .bar .f {
  height: 100%;
  background: linear-gradient(90deg, #a85808, #f0a818 55%, #ffe894);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 0 10px rgba(255,170,30,0.4);
}
.twin .bar .f.w28 { width: 28%; }
.twin .bar .f.w38 { width: 38%; }
.twin .bar .f.w42 { width: 42%; }
.twin .bar .f.w58 { width: 58%; }
.twin .bar .f.w62 { width: 62%; }

.prog {
  flex: 0 0 78px;
  display: flex; align-items: stretch; gap: 5px;
  padding: 11px 9px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(18,15,8,0.7) 0%, rgba(2,3,6,0.96) 100%);
  border: 1.5px solid rgba(255,190,64,0.42);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.12), 0 10px 22px rgba(255,120,10,0.16);
}
.seg {
  flex: 1; border-radius: 7px;
  background: #080a0e; border: 1.5px solid rgba(255,190,64,0.18);
}
.seg.on {
  background: linear-gradient(180deg, #ffe894 0%, #f0a818 45%, #a85808 100%);
  border-color: rgba(255,210,90,0.55);
  box-shadow: 0 0 12px rgba(255,170,30,0.48), 0 6px 12px rgba(255,120,10,0.2);
}

.pills {
  flex: 0 0 60px;
  display: flex; gap: 6px; padding: 8px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(16,14,9,0.75) 0%, rgba(4,4,5,0.95) 100%);
  border: 1.5px solid rgba(245,196,70,0.28);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.1), 0 8px 18px rgba(255,120,10,0.12);
}
.pill { flex: 1; border-radius: 999px; display: grid; place-items: center; }
.pill.live {
  background: linear-gradient(90deg, #a85808, #f0a818 44%, #ffe894);
  border: 1.5px solid #9a6810;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 6px 14px rgba(255,135,18,0.3);
}
.pill.off {
  background: #080706;
  border: 1.5px dashed rgba(160,156,140,0.28);
  opacity: 0.85;
}

.jar {
  flex: 0 0 108px;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 16px;
  background:
    linear-gradient(145deg, rgba(255,190,60,0.1), transparent 42%),
    linear-gradient(165deg, rgba(14,12,6,0.95), rgba(4,5,8,0.98));
  border: 1.5px solid rgba(255,190,64,0.55);
  box-shadow:
    inset 0 1px 0 rgba(255,230,160,0.18),
    0 12px 32px rgba(255,120,10,0.2),
    0 0 36px rgba(255,140,18,0.14);
}
.jar .star {
  flex: 0 0 54px; width: 54px; height: 54px;
  display: grid; place-items: center;
}
.jar .star svg {
  width: 42px; height: 42px;
  filter: drop-shadow(0 0 12px rgba(255,170,30,0.58));
}
.jar .meter {
  flex: 1; height: 52px; border-radius: 12px;
  background: #010205;
  border: 1.5px solid rgba(255,190,64,0.55);
  box-shadow: inset 0 3px 10px rgba(0,0,0,0.7), 0 0 16px rgba(255,140,18,0.2);
  overflow: hidden;
}
.jar .fill {
  height: 100%; width: 42%;
  background: linear-gradient(90deg, #a85808, #f0a818 50%, #ffe894);
  box-shadow: inset 0 3px 0 rgba(255,255,255,0.36), 0 0 20px rgba(255,170,30,0.52);
}

.foot {
  flex: 0 0 auto; text-align: center;
  font-size: 8px; font-weight: 700; letter-spacing: 0.14em;
  color: rgba(180,176,160,0.22); padding: 0;
}

/* TEXTBACK1 · essential plain words · keep icon heat */
.wlab {
  font-family: "JetBrains Mono", monospace;
  font-size: 12px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: lowercase; color: #ffe894;
  text-shadow: 0 0 12px rgba(255,170,30,0.5);
}
.next { gap: 8px; }
.next .wlab { font-size: 13px; letter-spacing: 0.16em; }
.next .kid {
  font-size: 15px; font-weight: 700; color: #f2ead4;
  opacity: 0.88; letter-spacing: -0.01em; text-align: center;
  line-height: 1.15; max-width: 92%;
}
.twin { gap: 10px; }
.twin .col {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column; justify-content: center; gap: 6px;
}
.twin .wlab { font-size: 13px; }
.twin .kid {
  font-size: 15px; font-weight: 700; color: #f2ead4;

.pill { padding: 0 6px; }
.pill .w {

}
.pill.live .w {

.jar { gap: 14px; }
.jar .col {
  flex: 0 0 auto;
  display: flex; flex-direction: column; gap: 4px; justify-content: center;
}
.jar .wlab { font-size: 14px; letter-spacing: 0.16em; }
.jar .kid {
  font-size: 14px; font-weight: 700; color: #f2ead4; opacity: 0.85;

.vinyl-bay .udot, .hero-bay .udot {

}

  color: #ffe894; text-transform: lowercase;
}
.vinyl-bay .udot.off .w, .hero-bay .udot.off .w {
  color: rgba(180,176,160,0.5);
}
.days {
  flex: 0 0 58px;
  display: flex; gap: 4px; padding: 7px 6px; border-radius: 14px;
  background: linear-gradient(180deg, rgba(16,14,9,0.75) 0%, rgba(4,4,5,0.95) 100%);
  border: 1.5px solid rgba(245,196,70,0.28);
  box-shadow: inset 0 1px 0 rgba(255,230,160,0.1), 0 8px 18px rgba(255,120,10,0.12);
}
.days .d {
  flex: 1; border-radius: 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px;
  background: rgba(8,7,6,0.72);
  border: 1px solid rgba(255,255,255,0.06);
  font-family: "JetBrains Mono", monospace;
}
.days .d .wd {
  font-size: 10px; font-weight: 800; letter-spacing: 0.04em;
  color: rgba(180,176,160,0.55); text-transform: uppercase;
}
.days .d.on {
  background: linear-gradient(180deg, #ffe894 0%, #f0a818 55%, #a85808 100%);
  border-color: rgba(255,210,90,0.55);
  box-shadow: 0 0 10px rgba(255,170,30,0.4);
}
.days .d.on .wd { color: #140c02; }
