      <clipPath id="dark"><path id="darkp" d=""/></clipPath>
    </defs>
    <circle r="118" fill="#cfd8ec" opacity=".18" filter="url(#mgl)" class="lh-moon-halo"/>
    <circle r="100" fill="#1b2232"/>
    <g clip-path="url(#dark)"><circle r="100" fill="#2b3346"/></g>
    <g clip-path="url(#lit)"><circle r="100" fill="url(#mg)"/>
      <ellipse cx="-30" cy="-26" rx="26" ry="20" fill="url(#ms)"/><ellipse cx="22" cy="-8" rx="30" ry="22" fill="url(#ms)"/><ellipse cx="-10" cy="34" rx="22" ry="16" fill="url(#ms)"/><ellipse cx="40" cy="38" rx="14" ry="11" fill="url(#ms)"/></g>

      <g clip-path="url(#dark)" fill="#e6e9f2"><text y="-40" font-size="17" font-weight="600" letter-spacing="2" data-lh="ap"></text><text y="14" class="t-time" font-size="58" font-weight="600" data-lh="time"></text><text y="50" class="t-date" font-size="21" font-weight="600" letter-spacing="1.5" data-lh="date"></text></g>

  <button type="button" id="lh-audience" class="lh-aud">Audience</button>
