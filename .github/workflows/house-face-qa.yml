# House Face · QA gates (real board changes only — NOT data refreshes)
# GATE 1 — placeholder lint · GATE 2 — Ledger numbers contract
# Data-only pushes (cal / Sensi / Nest / lights / kids-week) skip this so
# they never queue runners or spam failure emails.
name: house-face-qa

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
      - 'kids-week.json'
      - 'kids-data.js'
      - '**/nest-snaps/**'
  pull_request:
    paths-ignore:
      - 'data/**'
      - 'kids-week.json'
      - 'kids-data.js'
      - '**/nest-snaps/**'

concurrency:
  group: house-face-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate1-placeholder-lint:
    name: "GATE 1 · placeholder lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run GATE 1
        run: node scripts/qa/gate1-placeholder-lint.mjs

  gate2-numbers-contract:
    name: "GATE 2 · numbers contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run GATE 2
        run: node scripts/qa/gate2-numbers-contract.mjs
