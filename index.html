  /* WardOS House face — soft white/grey glass camo + Inter Display (updated 19 Sep 2026)
     Design canvas 1080×1920; scales to tablet / browser viewport. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100%; height: auto;
    overflow: auto;
    background: #d8dadf;

    -webkit-tap-highlight-color: transparent;

  .stage {
    width: 100%; height: 100%;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding:
      env(safe-area-inset-top, 0px)
      env(safe-area-inset-right, 0px)
      env(safe-area-inset-bottom, 0px)
      env(safe-area-inset-left, 0px);
    background: #d8dadf;
  }
  .scaler {
    width: 1080px; height: 1920px;
    flex-shrink: 0;
    transform-origin: center center;
  }
  .panel {
    width: 1080px; min-height: 1920px; height: auto;
    padding: 22px 36px 14px;
    display: flex; flex-direction: column; gap: 10px;
    position: relative; overflow: visible;
    background-color: #d8dadf;
    background-image:
      linear-gradient(165deg, rgba(255,255,255,0.36) 0%, rgba(220,222,226,0.24) 45%, rgba(180,184,190,0.18) 100%),

    background-position: center, 0 0;
    background-repeat: no-repeat, repeat;
  }
  .panel::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.46) 0%, transparent 28%, transparent 72%, rgba(40,42,46,0.09) 100%),
      radial-gradient(ellipse 70% 50% at 18% 12%, rgba(255,255,255,0.46) 0%, transparent 55%),
      radial-gradient(ellipse 50% 40% at 88% 78%, rgba(255,255,255,0.18) 0%, transparent 60%);
    mix-blend-mode: soft-light;
    opacity: 0.82;
  }
  .panel::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(118deg, transparent 0 34%, rgba(255,255,255,0.30) 34% 38%, transparent 38% 62%, rgba(255,255,255,0.12) 62% 64%, transparent 64%),

    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.52),
      inset 0 -1px 0 rgba(60,62,68,0.14),
      inset 1px 0 0 rgba(255,255,255,0.20),
      inset -1px 0 0 rgba(60,62,68,0.09);

  /* Kid entry · magnetic invite */
  a.who-chip {
    position: relative;
    transition: transform 0.14s ease, box-shadow 0.2s ease;
    animation: who-breathe 2.8s ease-in-out infinite;
  }
  a.who-chip.ain { animation-delay: 0s; }
  a.who-chip.hay { animation-delay: 0.35s; }
  a.who-chip.har { animation-delay: 0.7s; }
  a.who-chip::after {
    content: ""; position: absolute; inset: -3px; border-radius: 999px; pointer-events: none;
    opacity: 0.55;
    animation: who-ring 2.8s ease-in-out infinite;
  }
  a.who-chip.ain::after {
    box-shadow: 0 0 0 2px rgba(180,100,200,0.35), 0 0 18px rgba(200,120,220,0.45);
    animation-delay: 0s;
  }
  a.who-chip.hay::after {
    box-shadow: 0 0 0 2px rgba(40,160,120,0.35), 0 0 18px rgba(60,200,160,0.45);
    animation-delay: 0.35s;
  }
  a.who-chip.har::after {
    box-shadow: 0 0 0 2px rgba(70,120,200,0.35), 0 0 18px rgba(90,160,230,0.45);
    animation-delay: 0.7s;
  }
  a.who-chip:active {
    transform: scale(0.94);
    filter: brightness(1.08);
  }
  a.who-chip:active::after { opacity: 1; }
  @keyframes who-breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
  }
  @keyframes who-ring {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }
  a.chip.ain, a.chip.hay, a.chip.har {
    animation: chip-spark 2.6s ease-in-out infinite;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.9), 0 0 10px rgba(140,120,200,0.25);
  }
  a.chip.ain { animation-delay: 0s; }
  a.chip.hay { animation-delay: 0.25s; }
  a.chip.har { animation-delay: 0.5s; }
  @keyframes chip-spark {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); box-shadow: 0 0 0 1px rgba(255,255,255,1), 0 0 14px rgba(180,140,220,0.45); }
  }
  @media (prefers-reduced-motion: reduce) {
    a.who-chip, a.who-chip::after, a.chip.ain, a.chip.hay, a.chip.har {
      animation: none !important;
    }
  }

<script>
/* WEEKFIX1 · week board: kids-safe Dad-week banner + cal-live drives schedule.
   NEVER paint the word CUSTODY. Past Jessy vanity scrubbed. dmward23 → cal-live. */
(function () {
  var CAL_FRESH_MS = 6 * 60 * 60 * 1000;
  var PAST_VANITY_RE = /Ainsley vanity|vanity\s*·\s*Jessy|Jessy vanity|Sun\s*3:00\s*Ainsley/i;

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function fetchJson(url) {
    return fetch(url, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    });
  }

  function parseMs(iso) {
    if (!iso) return 0;
    var t = Date.parse(iso);
    return Number.isFinite(t) ? t : 0;
  }

  function chicagoIsoDay(ms) {
    try {
      return new Intl.DateTimeFormat("en-CA", {
        timeZone: "America/Chicago",
        year: "numeric", month: "2-digit", day: "2-digit"
      }).format(new Date(ms));
    } catch (e) {
      return "";
    }
  }

  function chicagoDow(ms) {
    try {
      return new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Chicago", weekday: "short"
      }).format(new Date(ms));
    } catch (e) {
      return "";
    }
  }

  function chicagoTime(ms) {
    try {
      var p = {};
      new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Chicago",
        hour: "numeric", minute: "2-digit", hour12: true
      }).formatToParts(new Date(ms)).forEach(function (x) {
        if (x.type !== "literal") p[x.type] = x.value;
      });
      return (p.hour || "") + ":" + (p.minute || "");
    } catch (e) {
      return "";
    }
  }

  function eventDayIso(ev) {
    if (!ev) return "";
    if (ev.allDay) {
      var s = String(ev.start || "");
      /* All-day Google often lands as YYYY-MM-DD or midnight Z */
      if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
      if (/T00:00:00Z$/.test(s)) return s.slice(0, 10);
      return chicagoIsoDay(parseMs(s)) || s.slice(0, 10);
    }
    return chicagoIsoDay(parseMs(ev.start || ev.startDateTime));
  }

  function eventStartMs(ev) {
    if (!ev) return 0;
    if (ev.startMs && Number.isFinite(ev.startMs)) return ev.startMs;
    return parseMs(ev.start || ev.startDateTime);
  }

  function chipsFromSummary(sum) {
    var s = String(sum || "");
    var chips = [];
    if (/Ainsley/i.test(s)) chips.push("ain");
    if (/Hayes/i.test(s)) chips.push("hay");
    if (/Harris/i.test(s)) chips.push("har");
    return chips;
  }

  function scrubMom(s) {
    return String(s || "")
      .replace(/\(\s*Mom[^)]*\)/gi, "")
      .replace(/\bMom\b[^·]*/gi, "")
      .replace(/\s{2,}/g, " ")
      .replace(/\s·\s*$/g, "")
      .trim();
  }

  function shortText(summary) {
    var s = scrubMom(summary);
    s = s.replace(/^Leave\s*[·•\-–—]\s*/i, "Leave · ");
    if (s.length > 52) s = s.slice(0, 49) + "…";
    return s;
  }

  function blockType(ev) {
    var s = String((ev && ev.summary) || "");
    if (/^Leave\b|DRIVE\b|drop-off|pickup|Nashville|DL replace|HD\s*#?\s*2209/i.test(s)) return "flight";
    if (/through\b.*ends|kids with Dad ends/i.test(s)) return "handoff";
    if (/Ainsley|Hayes|Harris|swim|baseball|flag|SRE|LKMS|Homework|Hearing|PE\b|field trip|appointment/i.test(s)) {
      return "kids";
    }
    return "urban";
  }

  function isPastVanityNoise(summary) {
    return PAST_VANITY_RE.test(String(summary || "")) && !/HD\s*#?\s*2209/i.test(String(summary || ""));
  }

  function addDaysIso(iso, n) {
    var parts = iso.split("-").map(Number);
    var utc = Date.UTC(parts[0], parts[1] - 1, parts[2] + n, 12, 0, 0);
    return chicagoIsoDay(utc);
  }

  function formatRangeLabel(startIso, endIso) {
    function lab(iso) {
      var ms = Date.parse(iso + "T12:00:00-05:00");
      try {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: "America/Chicago", weekday: "short", month: "short", day: "numeric"
        }).format(new Date(ms));
      } catch (e) {
        return iso;
      }
    }
    return lab(startIso) + " – " + lab(endIso) + " · Dad week @ 147th";
  }

  function bannerHtmlFromHome(home) {
    var place = (home && home.place) || "147th";
    var through = (home && home.through) || "Fri Oct 2 · 3:00";
    through = String(through).replace(/\s·\s*/g, " ");
    return "with <em>Dad</em> @ <em>" + esc(place) + "</em> through <em>" + esc(through) + "</em>";
  }

  function calIsFresh(cal, clock) {
    if (!cal) return { ok: false, reason: "cal-live missing" };
    if (cal.status === "error") return { ok: false, reason: "cal error" };
    if (cal.status === "stale") return { ok: false, reason: "cal-live status stale" };
    if (cal.status !== "live") return { ok: false, reason: "cal-live status " + (cal.status || "unknown") };
    var fetched = parseMs(cal.fetchedAt || cal.updatedAt);
    if (!fetched || (Date.now() - fetched) >= CAL_FRESH_MS) {
      return { ok: false, reason: "cal-live aged out · >6h" };
    }
    if (cal.asOfIso && clock && cal.asOfIso !== clock.iso) {
      return { ok: false, reason: "facts as-of " + cal.asOfIso + " · clock " + clock.iso };
    }
    return { ok: true };
  }

  function buildDaysFromCal(cal, clock, home) {
    var list = (cal && (cal.upcomingLeaves || cal.events)) || [];
    var byDay = {};
    list.forEach(function (ev) {
      if (isPastVanityNoise(ev.summary)) return;
      var day = eventDayIso(ev);
      if (!day) return;
      (byDay[day] || (byDay[day] = [])).push(ev);
    });
    Object.keys(byDay).forEach(function (d) {
      byDay[d].sort(function (a, b) { return eventStartMs(a) - eventStartMs(b); });
    });

    /* Visible window: today → Fri Oct 2 (Dad week end) or at least 5 days */
    var startIso = clock.iso;
    var endIso = (home && home.endIso) ? chicagoIsoDay(parseMs(home.endIso)) : "2026-10-02";
    if (!endIso || endIso < startIso) endIso = addDaysIso(startIso, 4);
    /* Cap display at 7 columns */
    var days = [];
    var cur = startIso;
    var guard = 0;
    while (cur <= endIso && guard < 7) {
      var ms = Date.parse(cur + "T12:00:00-05:00");
      var dow = chicagoDow(ms);
      var dom = String(Number(cur.split("-")[2]));
      var evs = byDay[cur] || [];
      var blocks = evs.map(function (ev) {
        var t = ev.allDay ? "" : chicagoTime(eventStartMs(ev));
        return {
          type: blockType(ev),
          time: t,
          text: shortText(ev.summary),
          chips: chipsFromSummary(ev.summary)
        };
      });
      if (!blocks.length) {
        blocks = [{
          type: "kids",
          text: "Kids with Dad @ " + ((home && home.place) || "147th"),
          chips: ["ain", "hay", "har"]
        }];
      }
      /* Fri handoff end if Dad week ends this day */
      if (home && home.endIso && chicagoIsoDay(parseMs(home.endIso)) === cur) {
        var hasEnd = blocks.some(function (b) { return /Dad week end|kids with Dad ends|Through/i.test(b.text || ""); });
        if (!hasEnd) {
          blocks.push({
            type: "handoff",
            time: "3:00",
            text: "Through · kids with Dad ends",
            chips: ["ain", "hay", "har"]
          });
        }
      }
      days.push({
        dow: dow,
        dom: dom,
        iso: cur,
        load: cur === clock.iso,
        isToday: cur === clock.iso,
        blocks: blocks
      });
      cur = addDaysIso(cur, 1);
      guard++;
    }
    return { days: days, startIso: startIso, endIso: endIso };
  }

  function pickBannerNext(cal, clock) {
    var list = (cal && (cal.upcomingLeaves || cal.events)) || [];
    var now = Date.now();
    var future = list.filter(function (ev) {
      if (isPastVanityNoise(ev.summary)) return false;
      if (ev.allDay) return false;
      return eventStartMs(ev) > now;
    }).sort(function (a, b) { return eventStartMs(a) - eventStartMs(b); });
    if (!future.length) return "next · clear on glass";
    var ev = future[0];
    var t = chicagoTime(eventStartMs(ev));
    var place = shortText(ev.summary);
    var day = eventDayIso(ev);
    var prefix = (day === clock.iso) ? "" : (chicagoDow(eventStartMs(ev)) + " ");
    return "next · " + prefix + t + " " + place;
  }

  function applyLeaveFromCal(cal, clock) {
    if (!FACTS.leaveBy) return;
    var strip = null;
    if (window.HouseBoardStrip && typeof HouseBoardStrip.pickStripFromCal === "function") {
      strip = HouseBoardStrip.pickStripFromCal(cal, clock);
    } else if (cal && cal.boardStrip) {
      strip = cal.boardStrip;
    }
    if (!strip) return;
    if (PAST_VANITY_RE.test(String(strip.place || "") + " " + String(strip.detailHtml || ""))) {
      /* Never paint lagged Jessy vanity into Next Up */
      strip = {
        label: "Next up · today",
        time: "",
        place: "CAL refresh · scrubbed past vanity",
        detailHtml: "Kids with Dad @ <strong>147th</strong> through Fri Oct 2 3:00",
        badge: clock.dow
      };
    }
    if (strip.label) FACTS.leaveBy.label = strip.label;
    if (strip.time != null) FACTS.leaveBy.time = strip.time;
    if (strip.place) FACTS.leaveBy.place = strip.place;
    if (strip.detailHtml) FACTS.leaveBy.detailHtml = strip.detailHtml;
    if (strip.badge) FACTS.leaveBy.badge = strip.badge;
    FACTS.leaveBy.date = clock.short;
  }

  function applyClockToFacts() {
    if (!window.HouseClock || typeof FACTS === "undefined") return;
    var c = HouseClock.now();
    FACTS.asOf = c.long;
    FACTS.asOfShort = c.short;
    if (FACTS.leaveCard) FACTS.leaveCard.dateLabel = c.short;
    if (FACTS.leaveBy) {
      FACTS.leaveBy.date = c.short;
      FACTS.leaveBy.badge = FACTS.leaveBy.badge || c.dow;
      if (/^Leave now/i.test(FACTS.leaveBy.label || "")) {
        FACTS.leaveBy.label = "Next up · " + c.dow;
      }
    }
    if (FACTS.week && FACTS.week.days) {
      FACTS.week.days.forEach(function (d) {
        d.isToday = !!(d.iso && d.iso === c.iso) ||
          (String(d.dom) === String(Number(c.iso.split("-")[2])) && d.dow === c.dow);
      });
    }
  }

  function applyHomeWeek(home) {
    if (!home || !FACTS.week) return;
    FACTS.week.bannerBadge = "WITH DAD";
    FACTS.week.bannerHtml = bannerHtmlFromHome(home);
    FACTS.week.banner = "with Dad @ " + (home.place || "147th") + " through " + (home.through || "Fri Oct 2 3:00");
    if (FACTS.meta && FACTS.meta.length) {
      FACTS.meta[0] = "Kids with Dad @ " + (home.place || "147th") + " · through " +
        String(home.through || "Fri Oct 2 3:00").replace(/\s·\s*/g, " ");
    }
  }

  function loadLive(cb) {
    var clock = window.HouseClock ? HouseClock.now() : { iso: "2026-09-28", short: "Mon Sep 28", long: "Mon Sep 28 2026", dow: "Mon" };
    var calUrls = ["data/cal-live.json?v=" + Date.now(), "data/cal-live.json"];
    var weekUrls = ["kids-week.json?v=" + Date.now(), "data/kids-week.json", "kids-week.json"];

    function tryUrls(urls, i) {
      if (i >= urls.length) return Promise.reject(new Error("missing"));
      return fetchJson(urls[i]).catch(function () { return tryUrls(urls, i + 1); });
    }

    Promise.all([
      tryUrls(calUrls, 0).catch(function () { return null; }),
      tryUrls(weekUrls, 0).catch(function () { return null; })
    ]).then(function (pair) {
      var cal = pair[0];
      var week = pair[1];
      var home = (week && week.homeWeek) || {
        with: "Dad", place: "147th", through: "Fri Oct 2 · 3:00",
        throughLabel: "with Dad @ 147th through Fri Oct 2 3:00",
        endIso: "2026-10-02T20:00:00.000Z"
      };
      /* Forever kids-safe: never surface a custody* label on glass */
      applyHomeWeek(home);

      var gate = calIsFresh(cal, clock);
      if (cal && gate.ok) {
        applyLeaveFromCal(cal, clock);
        var built = buildDaysFromCal(cal, clock, home);
        FACTS.week.days = built.days;
        FACTS.week.range = formatRangeLabel(built.startIso, built.endIso);
        FACTS.week.bannerNext = pickBannerNext(cal, clock);
        /* Watch row from next 3 timed events */
        var watch = [];
        ((cal.upcomingLeaves || []).filter(function (e) {
          return !e.allDay && !isPastVanityNoise(e.summary) && eventStartMs(e) > Date.now();
        })).slice(0, 3).forEach(function (e) {
          var day = eventDayIso(e);
          var lab = (day === clock.iso ? "" : chicagoDow(eventStartMs(e)) + " ") +
            chicagoTime(eventStartMs(e)) + " · " + shortText(e.summary);
          watch.push(lab);
        });
        if (watch.length && FACTS.nextTogether) FACTS.nextTogether.items = watch;
      } else if (week && week.boardStrip && FACTS.leaveBy) {
        var s = week.boardStrip;
        if (!PAST_VANITY_RE.test(String(s.place || ""))) {
          if (s.time) FACTS.leaveBy.time = s.time;
          if (s.place) FACTS.leaveBy.place = s.place;
          if (s.detailHtml) FACTS.leaveBy.detailHtml = s.detailHtml;
          if (s.label) FACTS.leaveBy.label = s.label;
          if (s.badge) FACTS.leaveBy.badge = s.badge;
        }
        FACTS.week.bannerNext = "next · cal stale · open Atlas refresh";
      } else {
        FACTS.week.bannerNext = "next · cal-live needed";
      }
      cb();
    }).catch(function () { cb(); });
  }

  applyClockToFacts();
  var _origRender = typeof render === "function" ? render : null;
  loadLive(function () {
    applyClockToFacts();
    if (_origRender) _origRender();
    var card = document.querySelector(".wx-card");
    if (card && window.HouseWeather) HouseWeather.mount(card);
  });
})();
</script>
