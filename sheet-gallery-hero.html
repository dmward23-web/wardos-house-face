<!DOCTYPE html>
<html data-export lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1170" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="WardOS House" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#d8dadf" />
<meta name="description" content="Board-OS House face · hero eight phone contact sheet · no money" />
<title>BOARD-OS · HOUSE · GALLERY HERO EIGHT</title>
<link rel="stylesheet" href="house-engage.css" />
<style>
  @font-face {
    font-family: "Inter Display";
    src: url("fonts/InterDisplay-Regular.ttf") format("truetype");
    font-weight: 400; font-style: normal;
  }
  @font-face {
    font-family: "Inter Display";
    src: url("fonts/InterDisplay-SemiBold.ttf") format("truetype");
    font-weight: 600; font-style: normal;
  }
  @font-face {
    font-family: "Inter Display";
    src: url("fonts/InterDisplay-Bold.ttf") format("truetype");
    font-weight: 700; font-style: normal;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1170px; height: 731px; overflow: hidden;
    background: #d8dadf; color: #121418;
    font-family: "Inter Display", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .panel {
    width: 1170px; height: 731px;
    padding: 12px 14px 10px;
    display: flex; flex-direction: column; gap: 8px;
    position: relative; overflow: hidden;
    background-color: #d8dadf;
    background-image:
      linear-gradient(165deg, rgba(255,255,255,0.36) 0%, rgba(220,222,226,0.24) 45%, rgba(180,184,190,0.18) 100%),
      url("camo-glass-tile.png");
    background-size: auto, 420px 420px;
    background-position: center, 0 0;
    background-repeat: no-repeat, repeat;
  }
  .panel::before {
    content: "";
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.46) 0%, transparent 28%, transparent 72%, rgba(40,42,46,0.09) 100%),
      radial-gradient(ellipse 70% 50% at 18% 12%, rgba(255,255,255,0.46) 0%, transparent 55%);
    mix-blend-mode: soft-light;
    opacity: 0.82;
  }
  .panel::after {
    content: "";
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.52),
      inset 0 -1px 0 rgba(60,62,68,0.14);
  }
  .panel > * { position: relative; z-index: 2; }

  .hdr {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-shrink: 0; padding: 8px 12px; border-radius: 12px;
    background: rgba(255,255,255,0.58);
    border: 1px solid rgba(255,255,255,0.85);
    box-shadow: 0 1px 0 rgba(255,255,255,0.95) inset, 0 6px 18px rgba(20,22,28,0.08);
  }
  .hdr-left { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 800; color: #fff;
    background: linear-gradient(145deg, #6a7078 0%, #3a4048 55%, #22262c 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,0.92), 0 0 0 4px rgba(60,64,72,0.28);
  }
  .eyebrow {
    font-size: 9px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #5a5e66;
  }
  .name { font-size: 20px; font-weight: 800; letter-spacing: -0.04em; color: #0e1014; line-height: 1; }
  .mock-tag {
    font-size: 8px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: #6a6e76; text-align: right; line-height: 1.35; padding: 5px 8px; border-radius: 8px;
    background: rgba(40,42,48,0.06); border: 1px solid rgba(40,42,48,0.12);
  }

  .shot-grid {
    flex: 1; min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
  }
  .card {
    display: flex; flex-direction: column; gap: 4px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(255,255,255,0.62);
    border: 1px solid rgba(255,255,255,0.90);
    box-shadow:
      0 1px 0 rgba(255,255,255,0.98) inset,
      0 8px 18px rgba(20,22,28,0.08);
    min-height: 0; overflow: hidden;
  }
  .thumb-wrap {
    flex: 1; min-height: 0;
    border-radius: 8px; overflow: hidden;
    background: rgba(40,42,48,0.06);
    border: 1px solid rgba(40,42,48,0.10);
  }
  .thumb-wrap img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    display: block;
  }
  .card-label {
    font-size: 13px; font-weight: 800; letter-spacing: -0.03em; color: #0e1014;
    padding: 0 2px 1px; flex-shrink: 0;
  }
  .ftr {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; color: #6a6e76; font-weight: 500;
  }
  .ftr-chip {
    font-size: 8px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    color: #3a3e46; border: 1px solid rgba(40,42,48,0.22);
    padding: 4px 8px; border-radius: 999px;
    background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(230,232,236,0.7));
  }
</style>
</head>
<body>
<div class="panel">
 <header class="hdr">
 <div class="hdr-left">
 <div class="avatar" aria-hidden="true">▦</div>
 <div>
 <div class="eyebrow">HOUSE · HERO EIGHT · PHONE</div>
 <h1 class="name">Gallery · page 1</h1>
 </div>
 </div>
 </header>

 <nav class="shot-grid" aria-label="Hero eight phone plates">
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-index-phone.png" alt="Index" /></div>
 <div class="card-label">Index</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-today-phone.png" alt="Today" /></div>
 <div class="card-label">Today</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-face-week-phone.png" alt="Week" /></div>
 <div class="card-label">Week</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-face-month-phone.png" alt="Month" /></div>
 <div class="card-label">Month</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-face-hayes-phone.png" alt="Hayes" /></div>
 <div class="card-label">Hayes</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-chores-phone.png" alt="Chores" /></div>
 <div class="card-label">Chores</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-load-day-phone.png" alt="Load day" /></div>
 <div class="card-label">Load day</div>
 </div>
 <div class="card">
 <div class="thumb-wrap"><img src="phone-shots/board-os-house-status-phone.png" alt="Status" /></div>
 <div class="card-label">Status</div>
 </div>
 </nav>

 <footer class="ftr">
 
 </footer>
</div>

<script src="house-zoom.js"></script>
</body>
</html>
